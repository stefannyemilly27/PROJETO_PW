services:

  php:
    build: .
    container_name: blog_php

    ports:
      - "8080:80"

    volumes:
      - ./login_acesso:/var/www/html

    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: blog_mysql

    restart: always

    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: yes
      MYSQL_DATABASE: projeto_pw_blog

    ports:
      - "3307:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: blog_phpmyadmin

    restart: always

    ports:
      - "8081:80"

    environment:
      PMA_HOST: mysql


    depends_on:
      - mysql
